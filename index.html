<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Asset Intel Node (Win98 Edition)</title>
    <style>
        :root {
            --win-bg: #C0C0C0;
            --win-border-light: #FFFFFF;
            --win-border-dark: #808080;
            --win-border-darker: #000000;
            --win-text: #000000;
            --win-title-bg: #000080;
            --win-title-text: #FFFFFF;
            --win-input-bg: #FFFFFF;
            --desktop-bg: #008080;
        }

        body {
            font-family: "Microsoft Sans Serif", "Ms Sans Serif", sans-serif;
            background-color: var(--desktop-bg);
            margin: 0;
            padding: 1rem;
            color: var(--win-text);
        }

        .window {
            background-color: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-border-light) var(--win-border-darker) var(--win-border-darker) var(--win-border-light);
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            padding: 2px;
        }

        .title-bar {
            background-color: var(--win-title-bg);
            color: var(--win-title-text);
            padding: 4px 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        /* Win98 Tab Interface Control */
        .tabs {
            display: flex;
            margin: 10px 10px 0 10px;
            padding: 0;
            list-style: none;
        }
        .tab-item {
            background: var(--win-bg);
            padding: 4px 12px;
            margin-right: 2px;
            border: 2px solid;
            border-bottom: none;
            border-color: var(--win-border-light) var(--win-border-dark) transparent var(--win-border-light);
            cursor: pointer;
            font-size: 13px;
        }
        .tab-item.active {
            font-weight: bold;
            padding-bottom: 6px;
            margin-bottom: -2px;
            background: var(--win-bg);
            z-index: 2;
            border-color: var(--win-border-light) var(--win-border-darker) transparent var(--win-border-light);
        }

        .window-body { 
            padding: 10px; 
            border: 2px solid;
            border-color: var(--win-border-light) var(--win-border-darker) var(--win-border-darker) var(--win-border-light);
            margin: 0 10px 10px 10px;
            background: var(--win-bg);
        }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .box {
            background: var(--win-bg);
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid;
            border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
        }

        h3.section-title {
            margin: 0 0 10px 0;
            font-size: 13px;
            font-weight: bold;
            text-decoration: underline;
        }

        video, .captured-preview-img {
            width: 100%;
            max-width: 100%;
            display: block;
            margin: 5px 0 10px 0;
            background: #000;
            border: 2px solid;
            border-color: var(--win-border-darker) var(--win-border-light) var(--win-border-light) var(--win-border-darker);
        }

        button, select {
            font-family: "Microsoft Sans Serif", "Ms Sans Serif", sans-serif;
            font-size: 13px;
            color: var(--win-text);
            background-color: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-border-light) var(--win-border-darker) var(--win-border-darker) var(--win-border-light);
            padding: 5px 14px;
            cursor: pointer;
            outline: none;
        }

        button:active:not(:disabled) {
            border-color: var(--win-border-darker) var(--win-border-light) var(--win-border-light) var(--win-border-darker);
            padding: 6px 13px 4px 15px;
        }

        button:disabled {
            color: var(--win-border-dark);
            text-shadow: 1px 1px var(--win-border-light);
            cursor: not-allowed;
        }

        input[type="text"], select, textarea {
            font-family: monospace;
            font-size: 13px;
            background-color: var(--win-input-bg);
            border: 2px solid;
            border-color: var(--win-border-darker) var(--win-border-light) var(--win-border-light) var(--win-border-darker);
            padding: 4px;
            box-sizing: border-box;
            outline: none;
            width: 100%;
        }

        .status-container {
            margin: 5px 0 10px 0;
            font-weight: bold;
            font-size: 13px;
            padding: 6px;
            background: #FFFFAA;
            border: 1px solid var(--win-border-dark);
        }

        /* Archive History Elements */
        .archive-list {
            max-height: 150px;
            overflow-y: scroll;
            background: var(--win-input-bg);
            border: 2px solid;
            border-color: var(--win-border-darker) var(--win-border-light) var(--win-border-light) var(--win-border-darker);
            margin-bottom: 10px;
        }
        .archive-item {
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            border-bottom: 1px solid #EEE;
        }
        .archive-item:hover, .archive-item.selected {
            background-color: var(--win-title-bg);
            color: var(--win-title-text);
        }
    </style>
</head>
<body>

    <div class="window" style="margin-top: 10px;">
        <div class="title-bar">
            <p class="title-bar-text">Asset_Intel_Console.exe</p>
        </div>

        <ul class="tabs">
            <li class="tab-item active" id="tab-capture" onclick="switchTab('capture')">Acquisition</li>
            <li class="tab-item" id="tab-archive" onclick="switchTab('archive')">Historical Archives</li>
        </ul>

        <div class="window-body">

            <div id="panel-capture" class="view-panel active">
                <fieldset class="box">
                    <legend style="font-weight: bold; font-size: 13px;">Cloud Link Connection</legend>
                    <input type="text" id="dropboxToken" placeholder="Input access token here...">
                </fieldset>

                <div class="box">
                    <label for="inspectionMode" style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px;">Operational Profile:</label>
                    <select id="inspectionMode">
                        <option value="gauge">Analogue Gauge & Valve Reading</option>
                        <option value="asset_tag">Asset Plate & Equipment Identification</option>
                        <option value="hazard">Safety Integrity & Corrosion Check</option>
                    </select>
                </div>

                <div class="box" id="capture-container">
                    <h3 class="section-title">Optical Intake</h3>
                    <video id="video" autoplay playsinline></video>
                    <div id="status" class="status-container">System operational. Ready for deployment intake.</div>
                    <button id="captureBtn" style="font-weight: bold; width: 100%; padding: 8px 0;">Capture and Queue</button>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>

                <div class="box" id="result-display-box" style="display:none;">
                    <h3 class="section-title" style="color: #000080;">Returned Cloud Analysis Results</h3>
                    <img id="livePreviewImg" class="captured-preview-img" src="" alt="Captured Asset context" />
                    <textarea id="liveResultText" style="height: 150px;" readonly></textarea>
                    <button id="resetViewBtn" style="width: 100%; font-weight: bold; margin-top: 10px; background-color: #D8D8D8;">Return to Main Acquisition Page</button>
                </div>
            </div>

            <div id="panel-archive" class="view-panel">
                <div class="box">
                    <h3 class="section-title">Saved Field Records Log</h3>
                    <div class="archive-list" id="archiveListContainer">
                        </div>
                    
                    <div id="archiveDetailBox" style="display:none;">
                        <p style="font-size: 11px; font-weight: bold; margin: 0 0 5px 0;" id="archiveMetaTimestamp">Timestamp: </p>
                        <img id="archivePreviewImg" class="captured-preview-img" src="" alt="Archive asset source" />
                        <textarea id="archiveResultText" style="height: 150px;" readonly></textarea>
                    </div>
                    <p id="archiveEmptyMsg" style="font-size: 12px; font-style: italic; text-align: center;">No stored logs discovered in device local browser cache.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const statusDiv = document.getElementById('status');
        const inspectionMode = document.getElementById('inspectionMode');
        const dropboxTokenInput = document.getElementById('dropboxToken');
        
        // Return view objects
        const captureContainer = document.getElementById('capture-container');
        const resultDisplayBox = document.getElementById('result-display-box');
        const livePreviewImg = document.getElementById('livePreviewImg');
        const liveResultText = document.getElementById('liveResultText');
        const resetViewBtn = document.getElementById('resetViewBtn');

        // History view objects
        const archiveListContainer = document.getElementById('archiveListContainer');
        const archiveDetailBox = document.getElementById('archiveDetailBox');
        const archiveEmptyMsg = document.getElementById('archiveEmptyMsg');
        const archiveMetaTimestamp = document.getElementById('archiveMetaTimestamp');
        const archivePreviewImg = document.getElementById('archivePreviewImg');
        const archiveResultText = document.getElementById('archiveResultText');

        let pollingInterval = null;

        // Initialize persistent local logs cache infrastructure 
        if (!localStorage.getItem('field_history_archive')) {
            localStorage.setItem('field_history_archive', JSON.stringify([]));
        }

        dropboxTokenInput.value = localStorage.getItem('field_dropbox_token') || '';
        dropboxTokenInput.addEventListener('input', () => {
            localStorage.setItem('field_dropbox_token', dropboxTokenInput.value.trim());
        });

        function switchTab(targetPanel) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            
            document.getElementById(`tab-${targetPanel}`).classList.add('active');
            document.getElementById(`panel-${targetPanel}`).classList.add('active');
            
            if(targetPanel === 'archive') renderArchiveList();
        }

        // Initialize Device Capture Video Feed
        navigator.mediaDevices.getUserMedia({ video: { maxWidth: 1280, maxHeight: 960, facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => {
                statusDiv.innerHTML = "<span style='color:red;'>Hardware Fault: Cannot bind optics channel. " + err.message + "</span>";
            });

        // Capture, send snapshot to Dropbox, then listen for response file
        captureBtn.addEventListener('click', async () => {
            const currentToken = localStorage.getItem('field_dropbox_token');
            if (!currentToken) {
                statusDiv.innerHTML = "<span style='color:red;'>Configuration Fault: Missing Dropbox token.</span>";
                return;
            }

            statusDiv.textContent = "Uploading image to cloud engine queue...";
            captureBtn.disabled = true;

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const currentImgBase64 = canvas.toDataURL('image/jpeg', 0.75);

            canvas.toBlob(async (blob) => {
                const uniqueId = Date.now();
                const taskProfile = inspectionMode.value;
                const filename = `${taskProfile}__field_capture_${uniqueId}.jpg`;
                const expectedResponseJsonName = `${taskProfile}__field_capture_${uniqueId}.json`;

                try {
                    const response = await fetch('https://content.dropboxapi.com/2/files/upload', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Content-Type': 'text/plain; charset=dropbox-cors-hack',
                            'Dropbox-API-Arg': JSON.stringify({ path: `/field_incoming/${filename}`, mode: 'add', autorename: true, mute: false })
                        },
                        body: blob
                    });

                    if (!response.ok) throw new Error(`Upload error status: ${response.status}`);
                    
                    statusDiv.innerHTML = "<span style='color:blue;'>Snapshot queued. Waiting for laptop VLLM calculation feedback loop...</span>";
                    
                    // Fire polling process to catch output JSON file dropped by laptop
                    startAwaitingVllmResponse(expectedResponseJsonName, currentImgBase64);

                } catch (err) {
                    statusDiv.innerHTML = `<span style='color:red;'>Transmission Fault: ${err.message}</span>`;
                    captureBtn.disabled = false;
                }
            }, 'image/jpeg', 0.75);
        });

        // Polling loop watching for processing file to drop in /field_outgoing
        function startAwaitingVllmResponse(jsonFilename, matchingImageBase64) {
            const currentToken = localStorage.getItem('field_dropbox_token');
            const downloadUrl = 'https://content.dropboxapi.com/2/files/download';
            const deleteUrl = 'https://api.dropboxapi.com/2/files/delete_v2';
            
            let attempts = 0;

            pollingInterval = setInterval(async () => {
                attempts++;
                if (attempts > 18) { // Timeout safety break at 3 minutes
                    clearInterval(pollingInterval);
                    statusDiv.innerHTML = "<span style='color:red;'>Feedback Loop Timeout: Laptop engine processing took too long.</span>";
                    captureBtn.disabled = false;
                    return;
                }

                try {
                    const checkResponse = await fetch(downloadUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Dropbox-API-Arg': JSON.stringify({ path: `/field_outgoing/${jsonFilename}` })
                        }
                    });

                    if (checkResponse.ok) {
                        // File found! Clear interval instantly.
                        clearInterval(pollingInterval);
                        
                        const jsonPayloadData = await checkResponse.json();

                        // Purge processing trace file from outgoing directory box cleanly
                        await fetch(deleteUrl, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ path: `/field_outgoing/${jsonFilename}` })
                        });

                        // Store transaction event inside system history data arrays
                        saveRecordToHistory(jsonPayloadData, matchingImageBase64);

                        // Feed parsed data visual objects back to app views layout context
                        displayIncomingCloudResult(jsonPayloadData, matchingImageBase64);
                    }
                } catch (e) {
                    console.log("Polling folder tracking cycle pass empty...", e);
                }
            }, 10000); // Polling verification clock rate configured to high frequency 10s intervals
        }

        function displayIncomingCloudResult(jsonData, imgBase64) {
            captureContainer.style.display = "none";
            resultDisplayBox.style.display = "block";
            
            livePreviewImg.src = imgBase64;
            liveResultText.value = JSON.stringify(jsonData, null, 2);
        }

        // Return to Acquisition layout screen configuration
        resetViewBtn.addEventListener('click', () => {
            resultDisplayBox.style.display = "none";
            captureContainer.style.display = "block";
            captureBtn.disabled = false;
            statusDiv.textContent = "Ready for consecutive deployment intake tracking loop.";
        });

        function saveRecordToHistory(jsonData, imgBase64) {
            const history = JSON.parse(localStorage.getItem('field_history_archive') || '[]');
            history.unshift({
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                metadata: jsonData,
                image: imgBase64
            });
            localStorage.setItem('field_history_archive', JSON.stringify(history));
        }

        // Render Archive log lists
        function renderArchiveList() {
            const history = JSON.parse(localStorage.getItem('field_history_archive') || '[]');
            archiveListContainer.innerHTML = '';
            
            if (history.length === 0) {
                archiveEmptyMsg.style.display = "block";
                archiveDetailBox.style.display = "none";
                return;
            }

            archiveEmptyMsg.style.display = "none";
            
            history.forEach((record) => {
                const item = document.createElement('div');
                item.className = 'archive-item';
                const summaryText = record.metadata.asset_id || record.metadata.item_summary || "Asset Log";
                item.textContent = `[${record.timestamp}] - ${summaryText}`;
                
                item.addEventListener('click', () => {
                    document.querySelectorAll('.archive-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    viewArchiveDetail(record);
                });
                
                archiveListContainer.appendChild(item);
            });
        }

        function viewArchiveDetail(record) {
            archiveDetailBox.style.display = "block";
            archiveMetaTimestamp.textContent = `Log Timestamp: ${record.timestamp}`;
            archivePreviewImg.src = record.image;
            archiveResultText.value = JSON.stringify(record.metadata, null, 2);
        }
    </script>
</body>
</html>
